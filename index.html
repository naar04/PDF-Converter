<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Converter SaaS</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:35px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.upload-box{
    border:2px dashed #64748b;
    border-radius:20px;
    padding:60px;
    text-align:center;
    cursor:pointer;
}

.upload-box:hover{
    border-color:#38bdf8;
}

input[type=file]{
    display:none;
}

.formats{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
}

.format-btn{
    padding:15px;
    border:none;
    border-radius:12px;
    background:#334155;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.format-btn.active{
    background:#38bdf8;
    color:black;
    font-weight:bold;
}

.convert-btn{
    width:100%;
    margin-top:25px;
    padding:18px;
    border:none;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.loader{
    display:none;
    text-align:center;
    margin-top:25px;
}

.result{
    display:none;
    margin-top:35px;
}

.preview{
    background:#020617;
    padding:20px;
    border-radius:14px;
    max-height:400px;
    overflow:auto;
    white-space:pre-wrap;
}

.download-btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 25px;
    background:#38bdf8;
    color:black;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
}

.error{
    color:#ef4444;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>PDF Converter SaaS</h1>

<label class="upload-box">

<input type="file" id="pdfFile" accept=".pdf">

<h2>Upload PDF</h2>

<p>Supports scanned PDFs and images</p>

</label>

<div class="formats">

<button class="format-btn active" data-format="txt">TXT</button>

<button class="format-btn" data-format="csv">CSV</button>

<button class="format-btn" data-format="excel">EXCEL</button>

<button class="format-btn" data-format="word">WORD</button>

<button class="format-btn" data-format="pdf">PDF</button>

</div>

<button class="convert-btn" onclick="convertPDF()">
Convert File
</button>

<div class="loader" id="loader">
Processing PDF...
</div>

<div class="error" id="error"></div>

<div class="result" id="result">

<h3>Preview</h3>

<div class="preview" id="preview"></div>

<a id="downloadBtn" class="download-btn">
Download File
</a>

</div>

</div>

</div>

<script>

let selectedFormat = "txt";

const buttons = document.querySelectorAll(".format-btn");

buttons.forEach(btn=>{

    btn.addEventListener("click", ()=>{

        buttons.forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        selectedFormat = btn.dataset.format;

    });

});

async function convertPDF(){

    document.getElementById("error").innerHTML = "";

    document.getElementById("result").style.display = "none";

    const file = document.getElementById("pdfFile").files[0];

    if(!file){

        alert("Upload PDF first");

        return;

    }

    const formData = new FormData();

    formData.append("file", file);

    formData.append("format", selectedFormat);

    document.getElementById("loader").style.display = "block";

    try{

        const response = await fetch(
            "https://pdf-converter-api-1-5wkz.onrender.com/convert",
            {
                method:"POST",
                body:formData
            }
        );

        const data = await response.json();

        console.log(data);

        document.getElementById("loader").style.display = "none";

        if(!data.success){

            document.getElementById("error").innerHTML = data.error;

            return;

        }

        document.getElementById("result").style.display = "block";

        document.getElementById("preview").textContent =
        data.text_preview;

        const downloadBtn =
        document.getElementById("downloadBtn");

        downloadBtn.href =
        "https://pdf-converter-api-1-5wkz.onrender.com" +
        data.download_url;

        downloadBtn.innerHTML =
        "Download " + selectedFormat.toUpperCase();

    }
    catch(err){

        console.log(err);

        document.getElementById("loader").style.display = "none";

        document.getElementById("error").innerHTML =
        "Conversion failed";

    }

}

</script>

</body>
</html>
