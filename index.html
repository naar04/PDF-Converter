<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Converter</title>
<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:40px;
}
.container{
    max-width:600px;
    margin:auto;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
}
button{
    padding:12px 20px;
    margin-top:20px;
    cursor:pointer;
}
textarea{
    width:100%;
    height:300px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>PDF Converter</h1>

<input type="file" id="pdfFile" accept=".pdf">

<br>

<button onclick="convertPDF()">Convert</button>

<textarea id="output" placeholder="Converted text will appear here"></textarea>

</div>

<script>

async function convertPDF() {

    const file = document.getElementById("pdfFile").files[0];

    if (!file) {
        alert("Please upload a PDF");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    try {

        const res = await fetch("https://pdf-converter-api-8be5.onrender.com/convert", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (!data.success) {
            alert(data.error || "Conversion failed");
            return;
        }

        document.getElementById("output").value = data.text;

    } catch (err) {
        console.log(err);
        alert("Server error or CORS issue");
    }
}

</script>

</body>
</html>
